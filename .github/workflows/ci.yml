name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 (Oct 2026) and stalled apt installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # unit tests also drive Chromium (export renderer check), so install it first
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: pnpm exec playwright install chromium
      - name: Install Chromium system dependencies
        # apt mirrors are occasionally very slow (one run took >6 min for 26 MB)
        timeout-minutes: 12
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e
      - run: node apps/cli/src/main.ts doctor
      - name: Reproducible demo (pnpm demo, temporary data dir)
        timeout-minutes: 5
        run: |
          export ATLAS_DATA_DIR="$(mktemp -d)" ATLAS_RUNTIME_DIR="$(mktemp -d)"
          pnpm demo
          node apps/cli/src/main.ts status --json
          node apps/cli/src/main.ts daemon stop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
