openapi: 3.1.0
info:
  title: System Atlas local daemon
  version: 0.1.0
  description: >
    Loopback-only API (127.0.0.1). Host must be a loopback name on the daemon port; browser
    Origin must be the daemon origin or an allowed dev origin. Token from the discovery record.
servers:
  - url: http://127.0.0.1:{port}
    variables: { port: { default: '0' } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
security:
  - bearer: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  { ok: { type: boolean }, service: { type: string }, version: { type: string } }
  /api/v1/status:
    get:
      summary: Daemon status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  startedAt: { type: string, format: date-time }
                  dataDir: { type: string }
                  node: { type: string }
        '401': { description: Missing or wrong token }
  /api/v1/stream:
    get:
      summary: Server-sent events (hello, heartbeats, change notifications)
      responses:
        '200':
          description: text/event-stream
