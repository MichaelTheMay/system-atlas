openapi: 3.1.0
info:
  title: System Atlas local daemon
  version: 0.1.0
  description: >
    Loopback-only API (127.0.0.1). Host must be a loopback name on the daemon port; browser
    Origin must be the daemon origin or an allowed dev origin. Token from the discovery record.
servers:
  - url: http://127.0.0.1:{port}
    variables: { port: { default: '0' } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
security:
  - bearer: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  { ok: { type: boolean }, service: { type: string }, version: { type: string } }
  /api/v1/status:
    get:
      summary: Daemon status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  startedAt: { type: string, format: date-time }
                  dataDir: { type: string }
                  node: { type: string }
        '401': { description: Missing or wrong token }
  /api/v1/projects:
    get:
      summary: List registered projects with their worktrees
      responses:
        '200': { description: OK }
    post:
      summary: Register a directory (idempotent). Reads only; never writes into the directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootPath]
              properties: { rootPath: { type: string, description: Absolute path } }
      responses:
        '201': { description: Newly registered worktree }
        '200': { description: Already registered }
        '400': { description: Relative path, missing path or not a directory }
  /api/v1/worktrees/{id}/scans:
    post:
      summary: Queue a scan. A newer request for the same worktree replaces a queued one and cancels a running one.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: Job accepted (id, state) }
        '404': { description: Unknown worktree }
  /api/v1/projects/{id}/issues:
    get:
      summary: Reconciliation issues (ambiguous or possible renames) of a project, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, all] } }
      responses:
        '200':
          { description: '{ issues } with kind, status, detail (from, to, fromIds, toIds, links)' }
  /api/v1/issues/{id}/resolve:
    post:
      summary: >-
        Link one old/new candidate pair as a user-accepted rename alias (pins, notes and positions
        follow it; human claims follow from the next scan), or dismiss the issue. The issue resolves
        once every old candidate is linked.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [action, fromId, toId],
                    properties:
                      { action: { const: link }, fromId: { type: string }, toId: { type: string } },
                  }
                - { type: object, required: [action], properties: { action: { const: dismiss } } }
      responses:
        '200': { description: '{ ok, issue, aliases }' }
        '400': { description: Invalid body or ids that are not candidates of this issue }
        '404': { description: Unknown issue }
        '409': { description: Issue not open, or a candidate already linked }
  /api/v1/settings/enrichment:
    get:
      summary: Enrichment settings (provider none|mock|mock-adversarial, daily token budget, per-request limits)
      responses:
        '200': { description: Settings }
    put:
      summary: Update enrichment settings (validated; no network provider exists)
      responses:
        '200': { description: Settings }
        '400': { description: Invalid settings }
  /api/v1/worktrees/{id}/enrich:
    post:
      summary: >-
        Explicitly request model claims for up to 20 entities. Per entity - disabled, completed,
        cached, skipped-budget, cancelled, failed or stale-precondition, with accepted/rejected
        counts. Output goes through the claim validator.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ results }' }
        '400': { description: 'Body is not { entityIds }' }
        '404': { description: Unknown worktree }
  /api/v1/projects/{id}/enrichment:
    get:
      summary: Settings and today's usage (estimated vs reported tokens, cached, skipped, cancelled, recent ledger)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ settings, usage }' }
  /api/v1/proposals/claims:
    post:
      summary: >-
        Propose claims (origin model or human) against a snapshot precondition. Every citation is
        verified (existing evidence of the snapshot/project, or a file range whose bytes and quote
        match). Model claims are stored as inferred; invalid items are rejected with reasons; every
        call is audited. See docs/agents.md.
      responses:
        '200':
          {
            description: '{ ok, proposalId, accepted: [{ index, claimId, status }], rejected: [{ index, reasons }] }',
          }
        '400': { description: Invalid batch (shape, predicate, missing model metadata) }
        '404': { description: Unknown snapshot }
        '409': { description: 'stale_precondition: the snapshot is no longer the latest' }
  /api/v1/claims/{id}/reject:
    post:
      summary: A person rejects a claim; the rejection is audited and survives later snapshots
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ ok }' }
        '404': { description: Unknown claim }
        '409': { description: Already rejected }
  /api/v1/projects/{id}/proposals:
    get:
      summary: Audit of claim proposals and reviews, newest first (accepted and rejected items with reasons)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: '{ proposals }' }
  /api/v1/worktrees/{id}/freshness:
    get:
      summary: Whether the working tree differs from the latest snapshot (hashes eligible files; no scan)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ snapshotId, snapshotDigest, currentDigest, changed }' }
        '404': { description: Unknown worktree }
  /api/v1/snapshots/{id}/search:
    get:
      summary: Entity search by name prefix (FTS5; user input is reduced to quoted prefix terms)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: '{ hits: [{ id, kind, displayName, canonicalName, path? }] }' }
        '404': { description: Unknown snapshot }
        '410': { description: Snapshot was compacted }
  /api/v1/artifacts/{id}:
    get:
      summary: Artifact metadata (never bytes; previews go through signed URLs on the isolated origin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Artifact }
        '404': { description: Unknown artifact }
  /api/v1/worktrees/{id}/watch:
    get:
      summary: Whether the daemon watches this worktree, with watched directory count, debounce and pending changes
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ watching, status }' }
        '404': { description: Unknown worktree }
    put:
      summary: >-
        Start or stop watching. While watching, edits are coalesced (750 ms quiet period, capped
        wait) into scans that queue behind a running scan instead of cancelling it. SSE events -
        watch.enabled, watch.changed, then scan.* and snapshot.published (noop when nothing changed).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: '{ watching, status }' }
        '400': { description: 'Body is not { enabled: boolean }' }
        '404': { description: Unknown worktree }
  /api/v1/jobs/{id}:
    get:
      summary: Job status (queued, running, succeeded, failed, cancelled) with snapshot id and counts
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: Unknown job }
  /api/v1/worktrees/{id}/snapshot:
    get:
      summary: Latest published snapshot (ready or partial) with coverage report, entity/relation counts, change summary and open issue count
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: No published snapshot }
  /api/v1/snapshots/{id}/changes:
    get:
      summary: Changes since the previous snapshot (added, removed tombstones, changed, renamed, stale, restored) and reconciliation issues
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 2000, default: 200 },
          }
      responses:
        '200': { description: OK }
        '404': { description: Unknown snapshot }
  /api/v1/snapshots/{id}/canvases:
    get:
      summary: View catalog of a snapshot (canvas specs and child/sibling links); see docs/views.md
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: Unknown snapshot }
        '410': { description: Superseded snapshot was compacted (see docs/persistence.md) }
  /api/v1/snapshots/{id}/canvases/{cid}/projection:
    get:
      summary: Lazily computed nodes, edges, ports, breadcrumbs, siblings and children of one canvas
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cid, in: path, required: true, schema: { type: string } }
        - {
            name: focus,
            in: query,
            description: Cluster drill-down path (own viewId),
            schema: { type: string, maxLength: 500 },
          }
      responses:
        '200': { description: OK }
        '404': { description: Unknown snapshot or canvas }
  /api/v1/worktrees/{id}/canvases:
    get:
      summary: Catalog of the latest published snapshot
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: No snapshot }
  /api/v1/snapshots/{id}/entities/{eid}:
    get:
      summary: Entity details for the inspector (owners, children, relations, evidence with freshness, claims, last change)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: eid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Unknown entity in this snapshot }
  /api/v1/snapshots/{id}/relations:
    get:
      summary: Relation details with evidence ("Why this edge?"); up to 50 ids
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: ids,
            in: query,
            required: true,
            schema: { type: string, description: comma-separated rel_ ids },
          }
      responses:
        '200': { description: OK }
  /api/v1/snapshots/{id}/source:
    get:
      summary: Source text of a file in the snapshot manifest; state=changed/deleted and no text when the file no longer matches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '400': { description: Invalid path }
        '403': { description: Resolves outside the registered root }
        '404': { description: Not in this snapshot }
        '413': { description: Too large }
  /api/v1/views/{viewId}/overlay:
    get:
      summary: Presentation overlay of a view (local profile); pass project to follow rename aliases
      parameters:
        - { name: viewId, in: path, required: true, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        '200': { description: OK (empty overlay with revision 0 when none saved) }
    put:
      summary: Save an overlay; body.revision must equal the stored revision
      parameters: [{ name: viewId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Saved; revision incremented }
        '400': { description: Invalid overlay }
        '409': { description: Revision conflict; body.current is the stored overlay }
  /api/v1/runs:
    post:
      summary: Create a run (rootPath or worktreeId, adapter, commandSummary, environmentSummary). Returns the run, a run-scoped ingestToken and whether it is bound to a snapshot of exactly the current tree. See docs/evidence.md.
      description: >-
        Optional body fields for importers - binding none (never linked to a snapshot; adds an
        "imported" capture gap; no scan), externalRef (a re-import with the same reference reopens
        that run with a fresh ingest token, answering 200 with existing true), startAt.
      responses:
        '201': { description: Created }
        '400': { description: Invalid body }
  /api/v1/runs/{id}:
    get:
      summary: Run detail (summary, process and task outcome, ordered events, artifacts, assertions, correlations, missing parents)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: Unknown run } }
  /api/v1/runs/{id}/events:
    post:
      summary: Append events (array, max 1000). Daemon token or X-Atlas-Run-Token for this run. Returns accepted, duplicates, rejected per index.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: OK },
          '401': { description: Unauthorized },
          '404': { description: Unknown run },
        }
  /api/v1/runs/{id}/artifacts:
    post:
      summary: Reserve an artifact (logicalName, mediaType, role, sha256, byteLength, eventId). uploadRequired=false when identical bytes are already stored.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Reserved }, '401': { description: Unauthorized } }
  /api/v1/artifacts/{id}/content:
    put:
      summary: Stream artifact bytes (application/octet-stream); verified against declared hash and size
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: Stored },
          '413': { description: Too large },
          '422': { description: Hash or size mismatch (artifact marked missing) },
        }
  /api/v1/artifacts/{id}/missing:
    post:
      summary: Declare that expected bytes will not arrive (shown as missing with the reason)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/v1/artifacts/{id}/preview-url:
    get:
      summary: Short-lived signed URL on the isolated preview origin for available bytes
      description: raw=1 always signs the raw-bytes URL (exports); otherwise JSON, CSV and text get the escaped viewer page.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: Bytes pending or missing } }
  /api/v1/runs/{id}/finish:
    post:
      summary: Process outcome (status, exitCode, signal). Idempotent for the same status; 409 when already finished differently.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: Already finished } }
  /api/v1/projects/{id}/runs:
    get:
      summary: Recent runs of a project with outcomes and counts
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/v1/stream:
    get:
      summary: Server-sent events (hello, heartbeats, project.registered, scan.started, snapshot.published, scan.failed, scan.cancelled)
      responses:
        '200':
          description: text/event-stream
