openapi: 3.1.0
info:
  title: System Atlas local daemon
  version: 0.1.0
  description: >
    Loopback-only API (127.0.0.1). Host must be a loopback name on the daemon port; browser
    Origin must be the daemon origin or an allowed dev origin. Token from the discovery record.
servers:
  - url: http://127.0.0.1:{port}
    variables: { port: { default: '0' } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
security:
  - bearer: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  { ok: { type: boolean }, service: { type: string }, version: { type: string } }
  /api/v1/status:
    get:
      summary: Daemon status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  startedAt: { type: string, format: date-time }
                  dataDir: { type: string }
                  node: { type: string }
        '401': { description: Missing or wrong token }
  /api/v1/projects:
    get:
      summary: List registered projects with their worktrees
      responses:
        '200': { description: OK }
    post:
      summary: Register a directory (idempotent). Reads only; never writes into the directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootPath]
              properties: { rootPath: { type: string, description: Absolute path } }
      responses:
        '201': { description: Newly registered worktree }
        '200': { description: Already registered }
        '400': { description: Relative path, missing path or not a directory }
  /api/v1/worktrees/{id}/scans:
    post:
      summary: Queue a scan. A newer request for the same worktree replaces a queued one and cancels a running one.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: Job accepted (id, state) }
        '404': { description: Unknown worktree }
  /api/v1/projects/{id}/issues:
    get:
      summary: Reconciliation issues (ambiguous or possible renames) of a project, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, all] } }
      responses:
        '200':
          { description: '{ issues } with kind, status, detail (from, to, fromIds, toIds, links)' }
  /api/v1/issues/{id}/resolve:
    post:
      summary: >-
        Link one old/new candidate pair as a user-accepted rename alias (pins, notes and positions
        follow it; human claims follow from the next scan), or dismiss the issue. The issue resolves
        once every old candidate is linked.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [action, fromId, toId],
                    properties:
                      { action: { const: link }, fromId: { type: string }, toId: { type: string } },
                  }
                - { type: object, required: [action], properties: { action: { const: dismiss } } }
      responses:
        '200': { description: '{ ok, issue, aliases }' }
        '400': { description: Invalid body or ids that are not candidates of this issue }
        '404': { description: Unknown issue }
        '409': { description: Issue not open, or a candidate already linked }
  /api/v1/settings/enrichment:
    get:
      summary: Enrichment settings (provider none|mock|mock-adversarial, daily token budget, per-request limits)
      responses:
        '200': { description: Settings }
    put:
      summary: Update enrichment settings (validated; no network provider exists)
      responses:
        '200': { description: Settings }
        '400': { description: Invalid settings }
  /api/v1/worktrees/{id}/enrich:
    post:
      summary: >-
        Explicitly request model claims for up to 20 entities. Per entity - disabled, completed,
        cached, skipped-budget, cancelled, failed or stale-precondition, with accepted/rejected
        counts. Output goes through the claim validator.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ results }' }
        '400': { description: 'Body is not { entityIds }' }
        '404': { description: Unknown worktree }
  /api/v1/projects/{id}/enrichment:
    get:
      summary: Settings and today's usage (estimated vs reported tokens, cached, skipped, cancelled, recent ledger)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ settings, usage }' }
  /api/v1/settings/design-agent:
    get:
      summary: >-
        Design-agent settings (D02c) - runtime, model, consent per runtime, hasApiKey (never the
        key), availability per runtime (claude-code runs only `claude --version`) and what each
        runtime sends off the machine.
      responses:
        '200': { description: '{ runtime, model, consented, hasApiKey, availability, sends }' }
    put:
      summary: >-
        Update { runtime?, model?, consent?, apiKey? }. consent records the one-time consent for a
        non-mock runtime; apiKey is written to <dataDir>/secrets/anthropic-api-key (0600) and never
        echoed.
      responses:
        '200': { description: Settings view, as GET }
        '400': { description: Invalid settings or something that is not an API key }
  /api/v1/projects/{id}/design/jobs/estimate:
    get:
      summary: Estimated tokens, daily budget and what leaves the machine, for the confirm dialog
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 3 } }
        - { name: runtime, in: query, schema: { enum: [mock, claude-code, anthropic-api] } }
        - { name: snapshotId, in: query, schema: { type: string } }
      responses:
        '200':
          {
            description: '{ snapshotId, runtime, model, units, depth, estimatedInputTokens, estimatedOutputTokens, dailyBudget, sends, external, consented }',
          }
        '404': { description: No snapshot yet }
  /api/v1/snapshots/{id}/design/claims:
    get:
      summary: >-
        Non-rejected subsystem and responsibility claims of a snapshot, with ids, origin, status
        and model, for the design review sheet and the copilot. Read only.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          {
            description: '{ snapshotId, claims: [{ id, subjectId, subjectName, predicate, value, origin, status, evidenceIds, model? }] }',
          }
        '404': { description: Malformed snapshot id }
  /api/v1/projects/{id}/design/jobs:
    get:
      summary: Recent design-agent jobs of the project
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ jobs }' }
    post:
      summary: >-
        Start a design-agent job (DesignJobRequest; manual only). Recorded as a run with adapter
        design-agent; progress streams as design.job events; proposals land as proposed. Board kinds
        (draft-board, critique-board, fill-doc, explain-scenario, variant-board, implementation-plan; D03c)
        take boardId / prompt / scenarioId instead of a snapshotId.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: The job (queued) }
        '400': { description: Invalid request }
        '403': { description: 'consent_required: the runtime sends data off the machine' }
        '404': { description: Unknown project, board or scenario, or snapshot of another project }
        '409': { description: 'job_running: one job per project at a time' }
        '429': { description: 'budget_exceeded: the anthropic-api daily token budget' }
  /api/v1/projects/{id}/design/jobs/{jobId}:
    get:
      summary: One job (state, run, proposed claims, usage, copilot output; board jobs add boardId, proposedBoardItems and result)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The job }
        '404': { description: Unknown job }
    delete:
      summary: Cancel a running job (the run is finished as cancelled)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Cancellation requested }
        '404': { description: Unknown job }
        '409': { description: Job already finished }
  /api/v1/proposals/claims:
    post:
      summary: >-
        Propose claims (origin model or human) against a snapshot precondition. Every citation is
        verified (existing evidence of the snapshot/project, or a file range whose bytes and quote
        match). Model claims are stored as inferred; invalid items are rejected with reasons; every
        call is audited. See docs/agents.md.
      responses:
        '200':
          {
            description: '{ ok, proposalId, accepted: [{ index, claimId, status }], rejected: [{ index, reasons }] }',
          }
        '400': { description: Invalid batch (shape, predicate, missing model metadata) }
        '404': { description: Unknown snapshot }
        '409': { description: 'stale_precondition: the snapshot is no longer the latest' }
  /api/v1/claims/{id}/reject:
    post:
      summary: A person rejects a claim; the rejection is audited and survives later snapshots
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ ok }' }
        '404': { description: Unknown claim }
        '409': { description: Already rejected }
  /api/v1/projects/{id}/proposals:
    get:
      summary: Audit of claim proposals and reviews, newest first (accepted and rejected items with reasons)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: '{ proposals }' }
  /api/v1/worktrees/{id}/freshness:
    get:
      summary: Whether the working tree differs from the latest snapshot (hashes eligible files; no scan)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ snapshotId, snapshotDigest, currentDigest, changed }' }
        '404': { description: Unknown worktree }
  /api/v1/snapshots/{id}/search:
    get:
      summary: Entity search by name prefix (FTS5; user input is reduced to quoted prefix terms)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: '{ hits: [{ id, kind, displayName, canonicalName, path? }] }' }
        '404': { description: Unknown snapshot }
        '410': { description: Snapshot was compacted }
  /api/v1/artifacts/{id}:
    get:
      summary: Artifact metadata (never bytes; previews go through signed URLs on the isolated origin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Artifact }
        '404': { description: Unknown artifact }
  /api/v1/worktrees/{id}/watch:
    get:
      summary: Whether the daemon watches this worktree, with watched directory count, debounce and pending changes
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ watching, status }' }
        '404': { description: Unknown worktree }
    put:
      summary: >-
        Start or stop watching. While watching, edits are coalesced (750 ms quiet period, capped
        wait) into scans that queue behind a running scan instead of cancelling it. SSE events -
        watch.enabled, watch.changed, then scan.* and snapshot.published (noop when nothing changed).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: '{ watching, status }' }
        '400': { description: 'Body is not { enabled: boolean }' }
        '404': { description: Unknown worktree }
  /api/v1/jobs/{id}:
    get:
      summary: Job status (queued, running, succeeded, failed, cancelled) with snapshot id and counts
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: Unknown job }
  /api/v1/worktrees/{id}/snapshot:
    get:
      summary: Latest published snapshot (ready or partial) with coverage report, entity/relation counts, change summary and open issue count
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: No published snapshot }
  /api/v1/snapshots/{id}/changes:
    get:
      summary: Changes since the previous snapshot (added, removed tombstones, changed, renamed, stale, restored) and reconciliation issues
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 2000, default: 200 },
          }
      responses:
        '200': { description: OK }
        '404': { description: Unknown snapshot }
  /api/v1/snapshots/{id}/canvases:
    get:
      summary: View catalog of a snapshot (canvas specs and child/sibling links); see docs/views.md
      description: >-
        Persisted architecture canvases plus system-design canvases (workspace "design"), which are
        planned on read from the snapshot's claims, the project's view overrides and its design
        elements, and never persisted. They are replanned without a rescan after claims are
        proposed or reviewed, an issue is resolved, an override is written or a design element
        changes (design.changed).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: Unknown snapshot }
        '410': { description: Superseded snapshot was compacted (see docs/persistence.md) }
  /api/v1/snapshots/{id}/canvases/{cid}/projection:
    get:
      summary: Lazily computed nodes, edges, ports, breadcrumbs, siblings and children of one canvas
      description: >-
        Design canvases with design elements also carry drift (DesignDrift[] - flow-not-in-code,
        code-flow-not-drawn once a flow is drawn on the canvas, bound-entity-missing); drawn nodes
        and edges carry designElementId, author, authorName, and unbound / drawn / ghost flags.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cid, in: path, required: true, schema: { type: string } }
        - {
            name: focus,
            in: query,
            description: Cluster drill-down path (own viewId),
            schema: { type: string, maxLength: 500 },
          }
      responses:
        '200': { description: OK }
        '404': { description: Unknown snapshot or canvas }
  /api/v1/worktrees/{id}/canvases:
    get:
      summary: Catalog of the latest published snapshot
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { description: No snapshot }
  /api/v1/snapshots/{id}/entities/{eid}:
    get:
      summary: Entity details for the inspector (owners, children, relations, evidence with freshness, claims, last change)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: eid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Unknown entity in this snapshot }
  /api/v1/snapshots/{id}/relations:
    get:
      summary: Relation details with evidence ("Why this edge?"); up to 50 ids
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: ids,
            in: query,
            required: true,
            schema: { type: string, description: comma-separated rel_ ids },
          }
      responses:
        '200': { description: OK }
  /api/v1/snapshots/{id}/source:
    get:
      summary: Source text of a file in the snapshot manifest; state=changed/deleted and no text when the file no longer matches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '400': { description: Invalid path }
        '403': { description: Resolves outside the registered root }
        '404': { description: Not in this snapshot }
        '413': { description: Too large }
  /api/v1/views/{viewId}/overlay:
    get:
      summary: Presentation overlay of a view (local profile); pass project to follow rename aliases
      parameters:
        - { name: viewId, in: path, required: true, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        '200': { description: OK (empty overlay with revision 0 when none saved) }
    put:
      summary: Save an overlay; body.revision must equal the stored revision
      parameters: [{ name: viewId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Saved; revision incremented }
        '400': { description: Invalid overlay }
        '409': { description: Revision conflict; body.current is the stored overlay }
  /api/v1/views/{viewId}/override:
    put:
      summary: Set or clear a view override (pin, suppress, promote) of a canvas; publishes views.changed
      description: >-
        promote with enabled true needs snapshotId (the latest snapshot) and subsystemPath; it
        re-proposes every non-rejected model subsystem claim of that snapshot whose path equals
        subsystemPath or is nested beneath it (segment-wise, trimmed, lowercased) as a human claim
        citing the same evidence, through the claim validator. The promote override is recorded only
        when nothing was rejected. Disabling promote removes the override but keeps accepted claims.
      parameters:
        [
          {
            name: viewId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^cvs_[0-9a-f]{16,64}$' },
          },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, enabled, projectId]
              properties:
                action: { type: string, enum: [pin, suppress, promote] }
                enabled: { type: boolean }
                projectId: { type: string }
                snapshotId: { type: string }
                subsystemPath: { type: string, maxLength: 80 }
      responses:
        '200':
          description: >-
            pin/suppress or disable - { projectId, targetId, action, enabled, overrides }; promote -
            { proposalIds, accepted, rejected, alreadyAccepted, overrideRecorded }
        '400': { description: Invalid body, or promote without snapshotId/subsystemPath }
        '404': { description: Unknown project or snapshot, or no proposed subsystem claims match }
        '409':
          description: >-
            promotion_rejected (validator reasons per claim; accepted ones are stored) or
            stale_precondition (a newer snapshot exists)
  /api/v1/projects/{id}/overrides:
    get:
      summary: View overrides of a project (pin, suppress, promote by canvas id)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ projectId, overrides: [{ targetId, action, createdAt }] }' }
        '404': { description: Unknown project }
  /api/v1/design/board-templates:
    get:
      summary: Starter design boards (D03)
      responses:
        '200': { description: '{ templates: [{ id, name, description, componentCount }] }' }
  /api/v1/projects/{id}/boards:
    get:
      summary: Design boards of a project (D03; design-first whiteboards, view data only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ projectId, boards: DesignBoardSummary[] }' }
        '404': { description: Unknown project }
    post:
      summary: Create a board (blank, from a template, or with a given document); publishes design.board.changed
      description: Body is DesignBoardCreate (packages/schema/src/design-board.ts). Boards nest at most three levels via parentBoardId.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object, required: [name] } } },
        }
      responses:
        '201': { description: The stored DesignBoard (revision 0) }
        '400': { description: Invalid body, unknown template, or nesting too deep }
        '404': { description: Unknown project }
  /api/v1/boards/{boardId}:
    get:
      summary: One board with its document (Excalidraw scene + component registry)
      parameters: [{ name: boardId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: DesignBoard }
        '404': { description: Unknown board }
    patch:
      summary: Save a board with optimistic concurrency; publishes design.board.changed
      description: Body is DesignBoardPatch { name?, document?, revision }. A stale revision is a 409 carrying the stored board as `current`.
      parameters: [{ name: boardId, in: path, required: true, schema: { type: string } }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object, required: [revision] } } },
        }
      responses:
        '200': { description: The stored DesignBoard (revision + 1) }
        '400': { description: Invalid document }
        '404': { description: Unknown board }
        '409': { description: Revision conflict }
    delete:
      summary: Delete a board and its internals boards; publishes design.board.changed
      parameters: [{ name: boardId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ deleted: string[] }' }
        '404': { description: Unknown board }
  /api/v1/boards/{boardId}/spec:
    get:
      summary: A board as a layout-free BoardSpec for agents (D03c; no scene, rejected items left out)
      parameters: [{ name: boardId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ boardId, name, source, revision, spec: BoardSpec, plan? }' }
        '404': { description: Unknown board }
  /api/v1/boards/{boardId}/proposals:
    post:
      summary: Merge an agent's partial BoardSpec as proposed items (D03c); publishes design.board.changed
      description: >-
        Body { spec, origin: { name?, jobId? } }. Items get new agent-… ids and status proposed;
        existing items are never changed; references to unknown ids are rejected with reasons. The
        jobId is kept only when it is the project's running design job.
      parameters: [{ name: boardId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          {
            description: '{ boardId, revision, accepted: [{ kind, id, specId }], rejected: [{ kind, specId, reasons }] }',
          }
        '400': { description: Invalid spec or the board would grow past its limits }
        '404': { description: Unknown board }
  /api/v1/projects/{id}/boards/proposed:
    post:
      summary: A new board drafted by an agent (source prompt; every item proposed; D03c)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: '{ board: DesignBoardSummary, accepted, rejected }' }
        '400': { description: Missing name or invalid spec }
        '404': { description: Unknown project }
  /api/v1/boards/{boardId}/review:
    post:
      summary: Accept or reject proposed board items (D03c); audited as board-review; publishes design.board.changed
      description: >-
        Body { accept?: ids, reject?: ids }. Only proposed items change (accept → active with origin
        kept, reject → rejected); the scene is restyled to match. Other ids come back in ignored.
      parameters: [{ name: boardId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ accepted, rejected, ignored: [{ id, reason }], board }' }
        '400': { description: Nothing to review, or an id both accepted and rejected }
        '404': { description: Unknown board }
  /api/v1/projects/{id}/design/elements:
    get:
      summary: User-authored design elements of a project (D02a; boxes, flows, sticky notes, subsystems)
      description: >-
        Keyed by project, so they survive every rescan. Active and proposed (agent ghost) elements;
        all=1 also lists rejected ones (audit). View data only - never entities, relations or claims.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: all, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: '{ projectId, elements: DesignElement[] }' }
        '404': { description: Unknown project }
    post:
      summary: Draw an element (author user, status active); publishes design.changed
      description: >-
        Body is DesignElementInput { body, boundEntityIds? } (packages/schema/src/design.ts).
        References are checked - parentId must be a live subsystem element of the project, flow
        ends live box/subsystem elements or entities of the project's latest snapshot, bound
        entities must exist there. Agent proposals are not created here (design jobs, D02c).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body] } } }
      responses:
        '201': { description: The stored DesignElement (revision 0) }
        '400': { description: Invalid body or reference }
        '404': { description: Unknown project }
  /api/v1/projects/{id}/design/elements/{elementId}:
    patch:
      summary: Edit an element with optimistic concurrency; publishes design.changed
      description: >-
        DesignElementPatch { body?, boundEntityIds?, status?, revision }. The kind never changes;
        status may only move proposed -> active or proposed -> rejected. A subsystem can never
        become its own ancestor.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: elementId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [revision] } } }
      responses:
        '200': { description: The updated element (revision incremented) }
        '400': { description: Invalid patch or reference }
        '404': { description: Unknown project or element }
        '409':
          {
            description: Revision conflict (body.current is the stored element) or element rejected,
          }
    delete:
      summary: Delete an element; publishes design.changed
      description: >-
        User elements are deleted; agent elements (proposed or accepted) are marked rejected and
        audited (proposals kind design-review). Flows ending at the element go with it; elements
        inside a deleted subsystem move up to its parent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: elementId, in: path, required: true, schema: { type: string } }
        - { name: revision, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: '{ deleted: string[], rejected: string[], reparented: string[] }' }
        '404': { description: Unknown project or element }
        '409': { description: Revision conflict }
  /api/v1/projects/{id}/design/elements/{elementId}/accept:
    post:
      summary: Accept an agent proposal (proposed -> active; author stays agent); publishes design.changed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: elementId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            { schema: { type: object, properties: { revision: { type: integer } } } }
      responses:
        '200': { description: The accepted element }
        '404': { description: Unknown project or element }
        '409':
          {
            description: Not proposed,
            revision conflict,
            or it refers to an element still proposed,
          }
  /api/v1/projects/{id}/design/group:
    post:
      summary: Group detected boxes into a subsystem as human subsystem claims; publishes design.changed
      description: >-
        { snapshotId (latest), path ('/'-separated, up to 3 levels, 80 chars), entityIds (box
        entity ids) }. One human subsystem claim per entity through the claim validator, citing the
        entity's analyzer evidence. Regrouping moves a box (its earlier human subsystem claims are
        rejected, audited). Writes no entities, relations or evidence.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId, path, entityIds]
              properties:
                snapshotId: { type: string }
                path: { type: string, maxLength: 80 }
                entityIds: { type: array, items: { type: string }, maxItems: 200 }
      responses:
        '200':
          {
            description: '{ proposalIds, accepted: [{ entityId, claimId, status }], rejected: [{ entityId, reasons }], alreadyGrouped, moved }',
          }
        '400': { description: Invalid body or path }
        '404': { description: Unknown project or snapshot }
        '409':
          { description: Every claim was rejected, or stale_precondition (a newer snapshot exists) }
  /api/v1/projects/{id}/design/hide:
    post:
      summary: Hide or show a detected design box; publishes design.changed
      description: >-
        Records (enabled) or removes a suppress view override whose target id is the box's anchor
        entity id (the entityId of its box node). The entity and its relations stay in the snapshot.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entityId, enabled]
              properties:
                entityId: { type: string }
                enabled: { type: boolean }
      responses:
        '200': { description: '{ projectId, targetId, action: suppress, enabled }' }
        '400': { description: Invalid body }
        '404': { description: Unknown project, or the entity is not in the latest snapshot }
  /api/v1/runs:
    post:
      summary: Create a run (rootPath or worktreeId, adapter, commandSummary, environmentSummary). Returns the run, a run-scoped ingestToken and whether it is bound to a snapshot of exactly the current tree. See docs/evidence.md.
      description: >-
        Optional body fields for importers - binding none (never linked to a snapshot; adds an
        "imported" capture gap; no scan), externalRef (a re-import with the same reference reopens
        that run with a fresh ingest token, answering 200 with existing true), startAt.
      responses:
        '201': { description: Created }
        '400': { description: Invalid body }
  /api/v1/runs/{id}:
    get:
      summary: Run detail (summary, process and task outcome, ordered events, artifacts, assertions, correlations, missing parents)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: Unknown run } }
  /api/v1/runs/{id}/events:
    post:
      summary: Append events (array, max 1000). Daemon token or X-Atlas-Run-Token for this run. Returns accepted, duplicates, rejected per index.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: OK },
          '401': { description: Unauthorized },
          '404': { description: Unknown run },
        }
  /api/v1/runs/{id}/artifacts:
    post:
      summary: Reserve an artifact (logicalName, mediaType, role, sha256, byteLength, eventId). uploadRequired=false when identical bytes are already stored.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Reserved }, '401': { description: Unauthorized } }
  /api/v1/artifacts/{id}/content:
    put:
      summary: Stream artifact bytes (application/octet-stream); verified against declared hash and size
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: Stored },
          '413': { description: Too large },
          '422': { description: Hash or size mismatch (artifact marked missing) },
        }
  /api/v1/artifacts/{id}/missing:
    post:
      summary: Declare that expected bytes will not arrive (shown as missing with the reason)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/v1/artifacts/{id}/preview-url:
    get:
      summary: Short-lived signed URL on the isolated preview origin for available bytes
      description: raw=1 always signs the raw-bytes URL (exports); otherwise JSON, CSV and text get the escaped viewer page.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: Bytes pending or missing } }
  /api/v1/runs/{id}/finish:
    post:
      summary: Process outcome (status, exitCode, signal). Idempotent for the same status; 409 when already finished differently.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: Already finished } }
  /api/v1/projects/{id}/runs:
    get:
      summary: Recent runs of a project with outcomes and counts
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/v1/stream:
    get:
      summary: Server-sent events (hello, heartbeats, project.registered, scan.started, snapshot.published, scan.failed, scan.cancelled)
      responses:
        '200':
          description: text/event-stream
